<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;background:#1a1a1a;color:#fff}
header{text-align:center;padding:3rem 1rem 2rem}
header h1{font-size:2rem;margin-bottom:.5rem}
header span{color:#E9C46A}
header p{color:#999;font-size:.9rem;margin-top:.5rem}
.filters{display:flex;justify-content:center;gap:.5rem;flex-wrap:wrap;padding:0 1rem 2rem}
.filters button{padding:.5rem 1.2rem;border:1px solid #555;background:transparent;color:#aaa;border-radius:2rem;cursor:pointer;font-size:.85rem;transition:all .2s}
.filters button:hover,.filters button.on{background:#C8102E;border-color:#C8102E;color:#fff}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;padding:0 1rem 3rem;max-width:1300px;margin:0 auto}
.card{position:relative;aspect-ratio:1;overflow:hidden;border-radius:8px;cursor:pointer;background:#2a2a2a}
.card img{width:100%;height:100%;object-fit:contain;background:#2a2a2a;transition:transform .3s}
.card:hover img{transform:scale(1.05)}
.card .info{position:absolute;bottom:0;left:0;right:0;padding:1rem;background:linear-gradient(transparent,rgba(0,0,0,.8));opacity:0;transition:opacity .3s}
.card:hover .info{opacity:1}
.card .info h3{font-size:.95rem}
.card .info p{font-size:.75rem;color:#ccc;margin-top:.25rem}
/* lightbox */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:999;display:none;align-items:center;justify-content:center}
.lb.on{display:flex}
.lb img{max-width:90vw;max-height:85vh;object-fit:contain;border-radius:4px}
.lb .close{position:absolute;top:20px;right:20px;color:#fff;font-size:2rem;cursor:pointer;background:none;border:none}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:3rem;cursor:pointer;background:none;border:none;padding:1rem}
.lb .prev{left:10px}.lb .next{right:10px}
.lb .cap{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);color:#ccc;font-size:.9rem}
footer{text-align:center;padding:2rem;color:#666;font-size:.8rem;border-top:1px solid #333}
footer a{color:#E9C46A}
.empty{grid-column:1/-1;text-align:center;padding:4rem;color:#666}
.empty span{font-size:3rem;display:block;margin-bottom:1rem}
</style>
</head>

</div>

<div class="gallery" id="gallery">

// ===== 渲染 =====
function render(filter='all'){
  const g = document.getElementById('gallery');
  const list = filter==='all' ? products : products.filter(p=>p.cat===filter);
  if(!list.length){ g.innerHTML='<div class="empty"><span>📷</span><p>此分類尚無商品</p></div>'; return; }
  g.innerHTML = list.map((p,i) => {
    const idx = products.indexOf(p);
    return `<div class="card" onclick="openLb(${idx})">
      <img src="${p.img}" alt="${p.name}" loading="lazy">
      <div class="info"><h3>${p.name}</h3><p>${p.desc||''}</p></div>
    </div>`;
  }).join('');
  document.querySelectorAll('.filters button').forEach(b=>b.classList.toggle('on',b.dataset.cat===filter));
}

// ===== Lightbox =====
let curIdx = 0;
function openLb(i){ curIdx=i; showLb(); document.getElementById('lb').classList.add('on'); }
function closeLb(){ document.getElementById('lb').classList.remove('on'); }
function prevImg(){ curIdx=(curIdx-1+products.length)%products.length; showLb(); }
function nextImg(){ curIdx=(curIdx+1)%products.length; showLb(); }
function showLb(){
  const p=products[curIdx];
  document.getElementById('lbImg').src=p.img;
  document.getElementById('lbCap').textContent=p.name+(p.desc?' - '+p.desc:'')+' ('+(curIdx+1)+'/'+products.length+')';
}
document.addEventListener('keydown',e=>{
  if(!document.getElementById('lb').classList.contains('on')) return;
  if(e.key==='Escape') closeLb();
  if(e.key==='ArrowLeft') prevImg();
  if(e.key==='ArrowRight') nextImg();
});

// ===== 分類篩選 =====
document.querySelectorAll('.filters button').forEach(b=>b.addEventListener('click',()=>render(b.dataset.cat)));

render();
